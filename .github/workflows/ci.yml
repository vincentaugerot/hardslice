name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# Each job starts from a fresh runner and checkout, without NuGet cache, artifacts or outputs of another job:
# together they prove the v0.1 contract from a clean state.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: false

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # Includes the template's integration tests, which start PostgreSQL with the runner's Docker.
      - name: Test
        run: dotnet test --no-build

  # Separate job: a fresh runner and checkout, without the build job's outputs or any NuGet cache,
  # so the template scenario cannot depend on state left by a previous build. It also runs the path of docs/getting-started.md.
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: false

      - name: Test template from a clean checkout
        run: scripts/test-template.sh

  # Separate job for the same reason: each fixture of demos/agent-fix/ must keep producing exactly its diagnostic on the current
  # template, verify must keep rejecting each known workaround, and the reference correction of each rule must pass it; each
  # recorded run of demos/add-feature/ must keep reaching its verdict.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: false

      - name: Prepare every agent fix demonstration, then verify its reference correction and known workarounds
        run: scripts/demo-agent-fix.sh verify-reference "$(mktemp -d)"

      - name: Verify every recorded add-feature run from its changes and its trace
        run: scripts/demo-add-feature.sh verify-recorded "$(mktemp -d)"

  # Separate job: the CI that a generated solution ships, .github/workflows/hardslice.yml, run on that solution from a fresh runner.
  # Its actions are those of this workflow at the same pins (TemplatePackageTests): this job sets up the SDK of the generated
  # global.json as its setup-dotnet step does, then runs the steps of its check job, scripts/check.sh without argument.
  generated-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: false

      - name: Generate a solution
        run: |
          work="$(mktemp -d)"
          scripts/generate-app.sh "$work"
          echo "GENERATED_SOLUTION=$work/Demo" >> "$GITHUB_ENV"

      - name: Validate its workflow
        run: scripts/generated-workflow.sh lint "$GENERATED_SOLUTION"

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: ${{ env.GENERATED_SOLUTION }}/global.json
          cache: false

      - name: Run the check job of its workflow
        run: scripts/generated-workflow.sh run "$GENERATED_SOLUTION" check
