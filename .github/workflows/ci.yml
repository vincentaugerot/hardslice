name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# Each job starts from a fresh runner and checkout, without NuGet cache, artifacts or outputs of another job:
# together they prove the v0.1 contract from a clean state.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: false

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # Includes the template's integration tests, which start PostgreSQL with the runner's Docker.
      - name: Test
        run: dotnet test --no-build

  # Separate job: a fresh runner and checkout, without the build job's outputs or any NuGet cache,
  # so the template scenario cannot depend on state left by a previous build. It also runs the getting started path of README.md.
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: false

      - name: Test template from a clean checkout
        run: scripts/test-template.sh

  # Separate job for the same reason: the PB-008 fixture must keep producing its HS016 on the current template.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: false

      - name: Prepare the HS016 agent fix demonstration from a clean checkout
        run: scripts/demo-hs016-agent-fix.sh prepare "$(mktemp -d)"
