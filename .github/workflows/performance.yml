name: Performance

# Cost of HardSlice analyzers on real builds of the PerfApp fixture, against the thresholds of docs/performance/analyzers.md.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - src/HardSlice.Analyzers/**
      - src/HardSlice.Templates/**
      - scripts/generate-app.sh
      - scripts/generate-perf-modules.sh
      - scripts/measure-analyzers.sh
      - global.json
      - Directory.Build.props
      - Directory.Packages.props
      - .github/workflows/performance.yml

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Fails only when the measurement cannot be made. An unstable series (exit code 3) or an overhead of the analyzers (exit code 4)
  # is not concluded on a single runner: performance-rerun measures again on another one.
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      verdict: ${{ steps.measure.outputs.verdict }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: false

      - name: Measure the analyzers
        id: measure
        run: |
          status=0
          scripts/measure-analyzers.sh || status=$?
          if [[ $status -eq 3 || $status -eq 4 ]]; then
            echo "::notice::No conclusion on a single runner: performance-rerun measures again on another one."
          elif [[ $status -ne 0 ]]; then
            exit "$status"
          fi

  # Two consecutive stable runs above a threshold confirm a regression. Any other outcome short of respected thresholds
  # leaves no conclusion: the workflow is to be run again.
  performance-rerun:
    needs: performance
    if: needs.performance.outputs.verdict == 'unstable' || needs.performance.outputs.verdict == 'overhead'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: false

      - name: Measure the analyzers again on another runner
        env:
          FIRST_VERDICT: ${{ needs.performance.outputs.verdict }}
        run: |
          status=0
          scripts/measure-analyzers.sh || status=$?
          case "$status" in
            0)
              ;;
            4)
              if [[ "$FIRST_VERDICT" == overhead ]]; then
                echo "::error::Confirmed regression: two consecutive stable runs exceed a threshold because of the HardSlice analyzers."
              else
                echo "::error::The analyzers exceed a threshold on one stable run only, after an unstable one: run the workflow again to conclude."
              fi
              exit 1
              ;;
            3)
              echo "::error::The series stay unstable on a second runner: no conclusion, run the workflow again."
              exit 1
              ;;
            *)
              exit "$status"
              ;;
          esac
