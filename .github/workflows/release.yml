name: Release

# Publishes HardSlice.Analyzers, HardSlice.Tool and HardSlice.Templates on NuGet.org when a tag v<version> is pushed, <version>
# being the one of Directory.Build.props, then verifies them from NuGet.org on a fresh runner, as a user installs them.
# Everything is built, tested and packed from the tag. Only the publish job holds a credential: it runs in the protected
# environment nuget, after the approval of the maintainer, and exchanges the OIDC token of this workflow for a NuGet.org API key
# of an hour (trusted publishing). Setup and rerun: docs/releasing.md.
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

# Never two publications of the same tag at once, and never one cancelled halfway through its pushes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # The tests of the CI build job, from the tag.
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: false

      - name: Check that the tag names the version of the packages
        id: version
        run: |
          version="$(dotnet msbuild src/HardSlice.Templates/HardSlice.Templates.csproj -getProperty:Version)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::The tag $GITHUB_REF_NAME does not name the version of Directory.Build.props, $version: tag v$version instead."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # Includes the template's integration tests, which start PostgreSQL with the runner's Docker.
      - name: Test
        run: dotnet test --no-build

  # The scenario of the CI template job, from the tag: it packs the three packages and runs docs/getting-started.md on them, with and without Bookings.
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # The upgrade probe packs the template of an earlier commit.
          fetch-depth: 0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: false

      - name: Test template from a clean checkout
        run: scripts/test-template.sh

  pack:
    needs: [build, template]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: false

      - name: Pack
        run: |
          for package in HardSlice.Analyzers HardSlice.Tool HardSlice.Templates; do
            dotnet pack "src/$package/$package.csproj" --configuration Release --output artifacts/packages
          done
          expected="$(printf '%s\n' "HardSlice.Analyzers.$VERSION.nupkg" "HardSlice.Templates.$VERSION.nupkg" "HardSlice.Tool.$VERSION.nupkg")"
          packed="$(cd artifacts/packages && printf '%s\n' * | LC_ALL=C sort)"
          if [[ "$packed" != "$expected" ]]; then
            echo "::error::artifacts/packages holds ${packed//$'\n'/, } instead of the three HardSlice packages at version $VERSION."
            exit 1
          fi

      - name: Verify the packages from their folder
        run: scripts/verify-published.sh "$VERSION" "$(mktemp -d)" --source artifacts/packages

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  # The only job with a credential, and the only one that changes NuGet.org: a package version pushed there can be unlisted, never replaced.
  # It reads only scripts/publish-packages.sh and scripts/nupkg.py from the tag, and pushes the packages of this run, no other.
  publish:
    needs: [build, pack]
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/publish-packages.sh
            scripts/nupkg.py
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
          cache: false

      - name: Log in to NuGet.org with the OIDC token of this workflow
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # Only while the tag still names the commit of this run, and only the packages NuGet.org does not serve yet: a version it
      # already serves must have the content of this run's package, or nothing is pushed. The template last: it pins the two others.
      - name: Push the packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: scripts/publish-packages.sh "$VERSION" packages --commit "$GITHUB_SHA" --remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"

  # A fresh runner, which has never seen the packages: it checks that NuGet.org serves the packages of the artifact of this run, then
  # installs the template from NuGet.org as docs/getting-started.md says, generates a solution with and without Bookings, runs
  # dotnet tool restore and dotnet hardslice check in each, adds a module and a command slice with the item templates and checks
  # again. Only the scripts come from the tag.
  verify:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/verify-published.sh
            scripts/item-completion.sh
            scripts/nupkg.py
            global.json
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: false

      - name: Check that NuGet.org serves the packages of this run, then install HardSlice.Templates from it and check generated solutions
        run: scripts/verify-published.sh "$VERSION" "$(mktemp -d)" --expect packages --wait-minutes 90
